services:
  postgres:
    image: postgres:18.7
    container_name: barista-postgres

    environment:
      POSTGRES_DB: barista
      POSTGRES_USER: barista_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - barista_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barista_admin -d barista"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  barista_postgres_data:
